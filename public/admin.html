<!DOCTYPE html>
<html lang="zh-CN">
<head><script>var __mr='footer',__md='xej6gfa9.qwenwork.host';document.addEventListener('DOMContentLoaded', function () {
  var BAR_HEIGHT = 48;

  // --- detect page theme ---
  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

  // fallback: sample body/html background color
  if (!isDark) {
    try {
      var sample = getComputedStyle(document.body).backgroundColor;
      if (sample === 'rgba(0, 0, 0, 0)' || sample === 'transparent') {
        sample = getComputedStyle(document.documentElement).backgroundColor;
      }
      if (sample && sample !== 'rgba(0, 0, 0, 0)' && sample !== 'transparent') {
        var m = sample.match(/\d+/g);
        if (m) {
          var brightness = (parseInt(m[0]) * 299 + parseInt(m[1]) * 587 + parseInt(m[2]) * 114) / 1000;
          isDark = brightness < 128;
        }
      }
    } catch (e) {}
  }

  // --- shared CSS (always injected into <head>) ---
  var SHARED_CSS = '<style>' +
    '@keyframes mulepage-svg-glow-dark{0%,100%{color:#ffffff}50%{color:#3b82f6}}' +
    '@keyframes mulepage-svg-glow-light{0%,100%{color:#000000}50%{color:#3b82f6}}' +
    '.mulepage-anim-dark{animation:mulepage-svg-glow-dark 2.5s ease-in-out infinite}' +
    '.mulepage-anim-light{animation:mulepage-svg-glow-light 2.5s ease-in-out infinite}' +
    '.mulepage-close-dark{color:rgba(255,255,255,0.3);transition:color 0.2s ease}' +
    '.mulepage-close-dark:hover{color:#ffffff}' +
    '.mulepage-close-light{color:rgba(0,0,0,0.3);transition:color 0.2s ease}' +
    '.mulepage-close-light:hover{color:#000000}' +
    '#mulepage-footer-link{display:inline-flex;align-items:center;line-height:0;outline:none}' +
    '.mulepage-footer-brand{display:inline-flex;align-items:center;box-sizing:border-box;height:32px;max-width:104px;overflow:hidden;padding:6px 12px;border-radius:999px;background:' + (isDark ? 'rgba(26,26,26,0.85)' : 'rgba(255,255,255,0.85)') + ';backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 0.5px ' + (isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)') + ',0 8px 24px -4px ' + (isDark ? 'rgba(0,0,0,0.28)' : 'rgba(0,0,0,0.07)') + ';transition:max-width 260ms cubic-bezier(0.22,1,0.36,1);will-change:max-width;white-space:nowrap}' +
    '.mulepage-footer-brand-hint{display:inline-block;max-width:0;margin-left:0;overflow:hidden;opacity:0;color:' + (isDark ? 'rgba(255,255,255,0.72)' : 'rgba(0,0,0,0.64)') + ';font-size:14px;font-weight:400;line-height:20px;transition:max-width 260ms cubic-bezier(0.22,1,0.36,1),margin-left 260ms cubic-bezier(0.22,1,0.36,1),opacity 180ms ease-out;will-change:max-width,opacity}' +
    '#mulepage-footer:hover .mulepage-footer-brand,#mulepage-footer:focus-within .mulepage-footer-brand{max-width:246px}' +
    '#mulepage-footer:hover .mulepage-footer-brand-hint,#mulepage-footer:focus-within .mulepage-footer-brand-hint{max-width:126px;margin-left:8px;opacity:1}' +
    '.mulepage-float-close{display:inline-flex;align-items:center;justify-content:center;max-width:0;margin-left:0;overflow:hidden;opacity:0;transition:max-width 0.2s ease,margin-left 0.2s ease,opacity 0.15s ease;padding:0;border:none;background:none;cursor:pointer;font-size:16px;line-height:1;font-weight:300;height:16px;will-change:max-width,opacity}' +
    '.mulepage-float:hover .mulepage-float-close{max-width:14px;margin-left:4px;opacity:1}' +
    '</style>';

  // always inject shared CSS into <head> so it survives banner removal
  document.head.insertAdjacentHTML('beforeend', SHARED_CSS);

  // --- SVG icon (shared, rx=0 for sharp corners) ---
  var ICON16 = '<svg width="16" height="16" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="36" height="36" rx="0" fill="#FBF9F6"/><g clip-path="url(#c_top)">' +
    '<path d="M6.387 21.732v8.895H18.762V28.5h2.32v1.16h8.121V28.5h1.16v-7.928h-1.16v-1.16h-4.64v-1.16h-1.16v-1.16h-1.16v-1.16h-1.16v-1.16h-1.16v-1.16h3.287v-1.934h3.48V9.357H16.442v3.48h-2.128V6.07h-2.32v2.127H9.674v3.48H7.547v10.055H6.387Z" fill="#000"/>' +
    '<path d="M13.154 21.732v-4.447h1.16v-1.16h4.448v4.447h-1.16v1.16h-4.448Z" fill="#fff"/>' +
    '<rect x="15.281" y="18.252" width="2.32" height="2.32" fill="#000"/>' +
    '<path d="M21.082 27.34v-5.608h1.16v-1.16h5.801v1.16h1.16v5.608h-1.16V28.5h-5.801v-1.16h-1.16Z" fill="#fff"/>' +
    '<path d="M26.883 21.732h-2.32v1.16h1.16v1.16h1.16v-2.32Z" fill="#000"/>' +
    '<path d="M22.242 24.053v2.32h1.16v1.16h3.48v-1.16h-2.32v-1.16h-1.16v-1.16h-1.16Z" fill="#000"/>' +
    '</g><defs><clipPath id="c_top"><rect width="24.75" height="24.75" fill="#fff" transform="translate(6 6)"/></clipPath></defs></svg>';

  var ICON16_FOOT = ICON16.replace(/c_top/g, 'c_foot');

  // --- 品牌标志：浅色主题使用原始深色 SVG，深色主题反相为白色。 ---
  var brandAssetFilter = isDark ? 'filter:invert(1);' : '';
  var BRAND_MARK = '<span style="display:inline-flex;align-items:center;gap:4px;line-height:0;">' +

    '<img src="https://gw.alicdn.com/imgextra/i2/O1CN01Hn0m411NLmdtyiXpF_!!6000000001554-55-tps-56-14.svg" alt="千问办公" width="56" height="14" style="display:block;user-select:none;' + brandAssetFilter + '" />' +
    '</span>';
  // 20 + 4 + 56 + 24 = 104px，与设计稿的 104 × 32 品牌胶囊一致。
  var TOP_BRAND_LOGO = '<span style="display:inline-flex;align-items:center;justify-content:center;width:104px;height:32px;padding:6px 12px;box-sizing:border-box;border-radius:999px;' +
    'background:' + (isDark ? 'rgba(255,255,255,0.12)' : '#f5f5f5') + ';">' + BRAND_MARK + '</span>';
  // 右下角入口默认只展示品牌；悬浮或键盘聚焦时在同一胶囊中平滑展开提示语。
  var FOOTER_BRAND_LOGO = '<span class="mulepage-footer-brand">' + BRAND_MARK +
    '<span class="mulepage-footer-brand-hint">AI 生成，请注意核实</span></span>';

  // --- banner (adapts to page theme) ---
  var bannerBg = isDark ? '#050505' : '#ffffff';
  var bannerBorder = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  var bannerColor = isDark ? '#fff' : '#000';
  var bannerDividerColor = isDark ? 'rgba(255,255,255,0.24)' : 'rgba(0,0,0,0.16)';
  var bannerCloseClass = isDark ? 'mulepage-close-dark' : 'mulepage-close-light';

  var BANNER = '<div id="mulepage-bar" dir="ltr" style="position:fixed;top:0;left:0;width:100%;height:' + BAR_HEIGHT + 'px;' +
    'background:' + bannerBg + ';border-bottom:1px solid ' + bannerBorder + ';color:' + bannerColor + ';' +
    'box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:8px;' +
    'font-family:\'PingFang SC\',Inter,-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;' +
    'font-size:14px;font-weight:500;line-height:20px;z-index:2147483647;">' +
    '<span aria-hidden="true" style="flex:1 1 0;height:32px;"></span>' +
    '<div style="display:flex;align-items:center;gap:8px;white-space:nowrap;">' +
    '<span>由</span>' +
    '<span id="mulepage-bar-link" role="link" tabindex="0" aria-label="打开千问办公" style="display:inline-flex;align-items:center;cursor:pointer;line-height:0;">' +

    '<span>创建</span>' +
    '<span aria-hidden="true" style="width:1px;height:16px;margin:0 4px;background:' + bannerDividerColor + ';"></span>' +
    '<span id="mulepage-bar-cta" role="link" tabindex="0" aria-label="用千问办公创建网站" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;cursor:pointer;">' +
    '<span>一句话创建你的网站</span><span aria-hidden="true" style="font-size:16px;line-height:16px;">\u2192</span></span>' +
    '</div>' +
    '<span style="flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;">' +
    '<button id="mulepage-bar-close" class="' + bannerCloseClass + '" aria-label="关闭千问办公品牌栏" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:8px;background:none;border:none;border-radius:999px;' +
    'font-size:18px;cursor:pointer;line-height:16px;font-weight:300;">\u00d7</button></span>' +
    '</div>';

  // --- 右下角品牌入口 ---
  var floatCloseColor = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.3)';
  var floatCloseHover = isDark ? '#ffffff' : '#000000';
  var byColor = isDark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.6)';

  var FOOTER = '<div id="mulepage-footer" dir="ltr" class="mulepage-float" style="position:fixed !important;bottom:16px !important;right:16px !important;z-index:2147483646;' +
    'display:inline-flex;align-items:center;padding:0;cursor:pointer;background:transparent;border:0;box-shadow:none;' +
    'font-family:Inter,-apple-system,BlinkMacSystemFont,\'Segoe UI\',\'Helvetica Neue\',sans-serif;">' +
    '<span id="mulepage-footer-link" role="link" tabindex="0" aria-label="打开千问办公" style="display:inline-flex;align-items:center;line-height:0;">' +
    FOOTER_BRAND_LOGO +
    '</span>' +
    '</div>';

  // --- insert banner (only when mode is "all") ---
  if (__mr === 'all') {
    document.body.insertAdjacentHTML('afterbegin', BANNER);

    // 顶栏品牌标志和行动文案均跳转至千问办公。
    var openQwenWork = function () {
      window.open('https://qwenwork.cn?utm_source=pages&utm_medium=banner&utm_campaign=pages_branding&utm_content=top_bar', '_blank', 'noopener');
    };
    var topBrandLink = document.getElementById('mulepage-bar-link');
    var topBrandCta = document.getElementById('mulepage-bar-cta');
    topBrandLink.addEventListener('click', openQwenWork);
    topBrandCta.addEventListener('click', openQwenWork);
    topBrandLink.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openQwenWork();
      }
    });
    topBrandCta.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openQwenWork();
      }
    });

    // Use the QwenWork favicon only as a fallback. Preserve favicons generated

    var existingIcon = document.querySelector('link[rel="icon"],link[rel="shortcut icon"]');
    if (!existingIcon) {
      var fi = document.createElement('link');
      fi.rel = 'icon';
      fi.type = 'image/svg+xml';
      fi.href = 'https://qwenwork.cn/app/favicon.svg';
      document.head.appendChild(fi);
    }

    // push down normal-flow content (accumulate on existing padding-top)
    var origPT = parseFloat(getComputedStyle(document.body).paddingTop) || 0;

    // push down all existing position:fixed elements

      var el = all[i];

      var cs = getComputedStyle(el);
      if (cs.position === 'fixed') {
        var t = parseFloat(cs.top);
        if (isNaN(t)) t = 0;
        el.style.top = (t + BAR_HEIGHT) + 'px';
        shifted.push({ el: el, orig: t });
      }
    }

    // close handler: restore everything
    document.getElementById('mulepage-bar-close').addEventListener('click', function () {
      document.getElementById('mulepage-bar').remove();
      document.body.style.paddingTop = origPT + 'px';
      for (var j = 0; j < shifted.length; j++) {
        shifted[j].el.style.top = shifted[j].orig + 'px';
      }
    });
  }

  // --- insert floating widget (only when __mr is set) ---
  if (__mr) {
    document.body.insertAdjacentHTML('beforeend', FOOTER);

    // 底部品牌标志点击后打开官网
    var footerLink = document.getElementById('mulepage-footer-link');
    if (footerLink) {
      footerLink.addEventListener('click', function () {
        window.open('https://qwenwork.cn?utm_source=pages&utm_medium=banner&utm_campaign=pages_branding&utm_content=bottom_bar', '_blank', 'noopener');
      });
      footerLink.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          footerLink.click();
        }
      });
    }

    // paid users (footer-only mode): add close button on hover
    if (__mr === 'footer') {
      var floatEl = document.getElementById('mulepage-footer');
      if (floatEl) {
        var closeBtn = document.createElement('button');
        closeBtn.className = 'mulepage-float-close';
        closeBtn.style.color = floatCloseColor;
        closeBtn.textContent = '\u00d7';
        closeBtn.addEventListener('mouseenter', function () { closeBtn.style.color = floatCloseHover; });
        closeBtn.addEventListener('mouseleave', function () { closeBtn.style.color = floatCloseColor; });
        closeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          floatEl.remove();
        });
        floatEl.appendChild(closeBtn);
      }
    }
  }

  // --- inject canonical link (all users) ---
  var canon = document.createElement('link');
  canon.rel = 'canonical';
  canon.href = 'https://' + location.hostname + '/';
  document.head.appendChild(canon);

  // --- inject og meta tags (all users) ---
  var ogDomain = __md;
  var ogTitle = document.title || ogDomain;
  var ogTags = [
    ['og:title', ogTitle],
    ['og:url', 'https://' + location.hostname + '/'],
    ['og:type', 'website'],
    ['og:image', 'https://mule.page/og/' + ogDomain + '.webp']
  ];
  for (var n = 0; n < ogTags.length; n++) {
    var existing = document.querySelector('meta[property="' + ogTags[n][0] + '"]');
    if (existing) existing.remove();
    var meta = document.createElement('meta');
    meta.setAttribute('property', ogTags[n][0]);
    meta.setAttribute('content', ogTags[n][1]);
    document.head.appendChild(meta);
  }
});
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>简历工坊 · 站长后台</title>
<link rel="stylesheet" href="./style.css" />
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .stat b { display: block; font-size: 21px; color: var(--navy); }
  .stat span { font-size: 12px; color: var(--ink2); }
  .panes { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .panes button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 13px; }
  .panes button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .pane { display: none; }
  .pane.on { display: block; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .box h3 { margin: 0 0 10px; font-size: 15px; }
  .form { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 7px; margin-bottom: 10px; }
  .form textarea, .form input, .form select { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 13px; }
  .mono { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .danger { color: var(--red); }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .head h1 { font-size: 17px; margin: 0; }
  .head .sp { flex: 1; }
  details summary { cursor: pointer; font-size: 12.5px; color: var(--ink2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>简历工坊 · 站长后台</h1>
    <span class="hint" id="who"></span>
    <span class="sp"></span>
    <a class="btn" href="./index.html">返回前台</a>
    <button class="btn" id="btnOut">退出登录</button>
  </div>

  <div class="panes" id="panes">
    <button data-p="ov" class="on">概览</button>
    <button data-p="users">账号管理</button>
    <button data-p="codes">邀请码</button>
    <button data-p="tpl">模板库</button>
    <button data-p="gloss">岗位词库</button>
    <button data-p="ai">AI 设置</button>
  </div>

  <section class="pane on" data-p="ov">
    <div class="cards" id="statCards"></div>
    <div class="box"><h3>最近注册</h3><div id="recent"></div></div>
    <div class="box"><h3>模板库刷新</h3>
      <p class="hint" style="margin-top:0">前台读的是数据库里的模板与词库，改完立即生效（最长 1 分钟缓存）。标记刷新只更新时间戳。</p>
      <button class="btn navy" id="btnMark">标记为刚刚更新</button></div>
  </section>

  <section class="pane" data-p="users">
    <div class="box"><h3>账号列表</h3><div id="userTable"></div></div>
  </section>

  <section class="pane" data-p="codes">
    <div class="box"><h3>新建邀请码</h3>
      <div class="form" style="grid-template-columns:2fr 1fr 1fr auto">
        <input id="ncCode" placeholder="留空自动生成" /><input id="ncLabel" placeholder="用途备注" />
        <input id="ncMax" type="number" value="20" placeholder="可用次数" /><button class="btn navy" id="ncAdd">生成</button>
      </div>
      <div id="codeTable"></div>
    </div>
  </section>

  <section class="pane" data-p="tpl">
    <div class="box"><h3>职业模板</h3>
      <div id="tplTable"></div>
      <details style="margin-top:12px"><summary>新增 / 编辑模板（JSON 方式，谨慎操作）</summary>
        <div class="form" style="grid-template-columns:1fr 1fr 1fr 1fr; margin-top:8px">
          <input id="tsSlug" placeholder="slug（英文小写）" /><input id="tsTitle" placeholder="显示名" />
          <input id="tsInd" placeholder="行业分组" /><input id="tsSort" type="number" placeholder="排序号" />
        </div>
        <input id="tsSummary" placeholder="一句话说明：这个岗位该写什么" style="width:100%;margin-bottom:6px;border:1px solid var(--line);border-radius:7px;padding:6px 8px" />
        <input id="tsTheme" placeholder='主题 JSON，如 {"layout":"sidebar","accent":"#2f5c8f"}' style="width:100%;margin-bottom:6px;border:1px solid var(--line);border-radius:7px;padding:6px 8px" />
        <textarea id="tsSample" rows="8" placeholder="示例数据 JSON（假名假公司）" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px" class="mono"></textarea>
        <button class="btn navy" id="tsSave" style="margin-top:8px">保存模板</button>
      </details>
    </div>
  </section>

  <section class="pane" data-p="gloss">
    <div class="box"><h3>岗位词库</h3>
      <div class="form" style="grid-template-columns:1.4fr 1fr 3fr .6fr auto">
        <select id="gsProf"></select>
        <select id="gsKind"><option>职责句式</option><option>成果句式</option><option>关键词</option><option>技能标签</option></select>
        <input id="gsText" placeholder="要插入的词库句子" /><input id="gsW" type="number" value="8" min="1" max="10" />
        <button class="btn navy" id="gsAdd">添加</button>
      </div>
      <div id="glossTable"></div>
    </div>
  </section>

  <section class="pane" data-p="ai">
    <div class="box"><h3>AI 写作助手配置</h3>
      <p class="hint" style="margin-top:0">不填 key 时前台使用内置规则引擎（检查量化/套话/长度等）。填入阿里云百炼（DashScope）API key 后，前台的「✨AI 检查/优化/补充灵感」自动切换为通义千问真 AI。key 保存在本站数据库，不会暴露给普通用户。</p>
      <div class="form" style="grid-template-columns:2fr 1fr 2fr auto">
        <input id="aiKey" placeholder="API Key（sk-…，留空保持不变）" />
        <input id="aiModel" placeholder="模型，如 qwen-plus" />
        <input id="aiBase" placeholder="接口地址，默认百炼 compatible-mode" />
        <button class="btn navy" id="aiSave">保存配置</button>
      </div>
      <p class="hint" id="aiState" style="margin:6px 0 0"></p>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="./admin.js"></script>
</body>
</html>
